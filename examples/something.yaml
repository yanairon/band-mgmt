# Something - The Beatles (Roi Peled house style; content verified with Yanai).
# Each unique section is written once; repeats and volta endings compress it.
title: Something
artist: The Beatles
key: c major
time: 4/4
instrument: Guitar

sections:
  # Intro riff, 4 written bars (bars 1-4)
  - label: "פתיחה"
    bars:
      - { chords: F }
      - { chords: Eb }
      - { chords: G }
      - { chords: A }

  # Verse, played twice with different endings (bars 5-21 written)
  - label: "בית"
    repeat: 2
    bars:
      - { chords: C }
      - { chords: Cmaj7 }
      - { chords: C7 }
      - { chords: F }
      - { chords: D7 }
      - { chords: G }
      - { chords: Am }
      - { chords: "Am/G#", break: true }
      - { chords: "Am/G" }
      - { chords: D7 }
    endings:
      - [F, Eb, G]
      - [F, Eb, G, A]

  # Bridge, two chords per bar, volta endings (bars 22-26 written)
  - label: "גשר"
    repeat: 2
    bars:
      - [A, "A/G#"]
      - ["F#m", "F#m/E"]
      - [D, G]
    endings:
      - [A]
      - [C]
    roadmap_after:
      - "בית 3 - סולו"
      - "בית 4"

  # Outro riff, volta endings (bars 27-31 written)
  - label: "סיום"
    repeat: 2
    bars:
      - { chords: F }
      - { chords: Eb }
      - { chords: G }
    endings:
      - [A]
      - [C]
    final_barline: true
